<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio HBO Login</title>
    <link rel="stylesheet" href="./assets/CSS/signIn.css">
</head>
<body>
    <nav>
        <div class="logo-menu">
            <img src="assets/images/hbo-logo.svg" alt="Logo HBO Max">
        </div>
        <div class="info-menu">
            <ul>
                <li><a href="#" class="login-menu">Entrar</a></li>
            </ul>
            <button>Assine agora</button>
        </div>
    </nav>
    <main>
        <form class="login-hbo">
            <h1>entrar</h1>
            <label class="label-email">Você tem uma conta da HBO Max?</label> <!--associa o rótulo ao elemento <input>-->
            <input class="input-email" type="email" id="email" placeholder="Endereço de email">
            <input class="input-password" type="password" id="password" placeholder="Senha" minlength="8">
            <div class="action-form">
                <button class="button-form" type="submit">Entrar</button>
                <a href="#" class="forgot-password">Esqueceu a senha?</a>
            </div>
        </form>
    </main>
    <footer>
        <ul class="footer-links">
            <li><a href="">Agora na HBO Max</a></li>
            <li><a href="">Em breve</a></li>
            <li><a href="">Filme em destaque</a></li>
            <li><a href="">Séries</a></li>
            <li><a href="">Ajuda</a></li>
        </ul>
        <p class="footer-signature">© 2022 WarnerMedia Direct Latin America, LLC. Todos os direitos reservados. HBO Max é usado sob licença.</p>
        <div class="fotter-social-infos">
            <a href="https://www.facebook.com/HBOMaxBr/">
                <img src="assets/images/fb_0.png" alt="Facebook">
            </a>
            <a href="https://twitter.com/HBOMaxBR">
                <img src="assets/images/twitter_0.png" alt="Twitter">
            </a>
            <a href="https://www.instagram.com/hbomaxbr/">
                <img src="assets/images/instagram_0.png" alt="Instagram">
            </a>
            <a href="https://www.youtube.com/c/hbomaxbr">
                <img src="assets/images/youtube_0.png" alt="Youtube">
            </a>
        </div>
    </footer>
</body>
</html>
